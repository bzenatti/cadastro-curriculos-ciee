server {
  listen 80;
  root /usr/share/nginx/html;

  # O Docker resolve o nome "api" a cada requisição. Sem isso, o nginx guardaria o IP da subida
  # e daria 502 depois de recriar só o container da API.
  resolver 127.0.0.11 valid=10s;

  # Limite do PDF (5 MB) mais 1 MB de folga para os cabeçalhos do multipart. Até 6 MB a regra dos 5 MB é da API (mensagem em português);
  # acima disso quem responde é o nginx (413, sem JSON). Mantenha igual ao MaxRequestBytes do ResumesController.
  client_max_body_size 6m;

  location /api/ {
    set $api http://api:8080;
    proxy_pass $api;
  }

  # React Router: qualquer outra rota devolve o index.html (ex.: recarregar /candidatos/3).
  location / {
    try_files $uri /index.html;
  }
}

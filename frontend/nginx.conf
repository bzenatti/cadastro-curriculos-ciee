server {
  listen 80;
  root /usr/share/nginx/html;

  # O Docker resolve o nome "api" a cada requisição. Sem isso, o nginx guardaria o IP da subida
  # e daria 502 depois de recriar só o container da API.
  resolver 127.0.0.11 valid=10s;

  # Folga para o upload do PDF (5 MB): a mensagem de "passou de 5 MB" vem da API, não do nginx.
  client_max_body_size 10m;

  location /api/ {
    set $api http://api:8080;
    proxy_pass $api;
  }

  # React Router: qualquer outra rota devolve o index.html (ex.: recarregar /candidates/3).
  location / {
    try_files $uri /index.html;
  }
}
